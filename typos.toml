# typos configuration for geectl.
#
# The spellchecker runs in CI (typos.yml) over the whole repo. The
# default dictionary is used; add a word to [default.extend-words]
# only when it is a real word the dictionary does not know (a project
# name, an API term), never to silence a genuine typo.
[default.extend-words]

# Verbatim upstream files are excluded: their text is not ours to fix.
[files]
extend-exclude = ["tests/local_build_e2e/tumbleweed.conf"]

# `ba` is a hex fragment, not a word: the EUC-JP transcoding test in
# changes.rs spells a CJK code point as `\u{78ba}`, and typos tokenizes
# the escape's hex digits. Scoped to that file so the allow-list does
# not silence a real "ba" typo repo-wide.
[type.euc-jp-fixture]
extend-glob = ["**/changes.rs"]
extend-words = { ba = "ba" }
