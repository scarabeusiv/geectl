[package]
name = "geectl"
version = "0.2.2"
edition = "2021"
rust-version = "1.99.1"
description = "Geeko Controller — a CLI for openSUSE packaging workflows (OBS + src.opensuse.org)"
license = "Apache-2.0"
repository = "https://github.com/scarabeusiv/geectl"

[lib]
name = "geectl"
path = "src/lib.rs"

[[bin]]
name = "geectl"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
chardetng = "1"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
fs2 = "0.4"
# Renders `_service` comments as plain text: the stored file's
# commented-out content is part of what a reader sees. The render
# is bounded (finite width, capped comment count and length), and
# `cargo deny check` is clean for this tree.
html2text = "0.17"
libc = "0.2"
log = "0.4"
md5 = "0.7"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.2"
ureq = { version = "3", features = ["rustls", "socks-proxy"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic is informative locally; CI uses -D warnings on the default set only
# (do not enable pedantic as warn-as-error — it blocks scaffolding with style
# nits).
pedantic = { level = "allow", priority = -1 }
