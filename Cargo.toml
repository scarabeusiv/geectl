[package]
name = "geectl"
version = "0.2.1"
edition = "2021"
rust-version = "1.99.1"
description = "Geeko Controller — a machine-first CLI for agents (OBS + src.opensuse.org)"
license = "Apache-2.0"
repository = "https://github.com/scarabeusiv/geectl"

[lib]
name = "geectl"
path = "src/lib.rs"

[[bin]]
name = "geectl"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = { version = "3", features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Pedantic is informative locally; CI uses -D warnings on the default set only
# (do not enable pedantic as warn-as-error — it blocks scaffolding with style
# nits).
pedantic = { level = "allow", priority = -1 }
