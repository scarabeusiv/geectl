name: Read rust-version from Cargo.toml
description: >
  Read the toolchain version from Cargo.toml `rust-version` (the single
  source of truth), validate its shape, and export it as RUSTUP_TOOLCHAIN
  so the derived toolchain actually takes effect: rust-toolchain.toml
  outranks the rustup default the dtolnay action sets.
outputs:
  value:
    description: The rust-version from Cargo.toml.
    value: ${{ steps.read.outputs.value }}
runs:
  using: composite
  steps:
    - id: read
      shell: bash
      run: |
        version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
        test -n "$version" || { echo "rust-version not found in Cargo.toml" >&2; exit 1; }
        # The value comes from Cargo.toml (PR-controlled), so validate
        # its shape before any later step uses it.
        [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "invalid rust-version: $version" >&2; exit 1; }
        echo "value=$version" >> "$GITHUB_OUTPUT"
        # rust-toolchain.toml outranks the rustup default, so export
        # RUSTUP_TOOLCHAIN: the derived toolchain is the one later
        # steps in the job actually use.
        echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
