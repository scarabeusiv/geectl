# Freshness: keep the dependencies from rotting.
#
# Runs weekly (and on demand). It FAILS — it does not just report — on:
#   - any outdated dependency (`cargo outdated`, failing exit code),
#   - any `cargo audit` advisory,
#   - any `cargo deny check` failure (licenses, advisories, sources),
#   - any unused dependency (`cargo machete`),
#   - a stale `Cargo.lock` (not up to date with Cargo.toml).
#
# This workflow is separate from test.yml on purpose: a freshness
# failure does not block feature PRs. But it is visible (README badge)
# and it stays red until the Dependabot PR is merged. The repo is kept
# green by merging Dependabot PRs promptly, not by relaxing the checks.
# If a check turns out too noisy in practice, it is relaxed deliberately
# in a PR with a reason — never silently.

name: freshness

on:
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pinned to the v4 tag's commit so the action cannot move under us;
      # Dependabot tracks SHA pins and proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the v1 tag's commit so the action cannot move under us
      # and the SHA cannot be garbage-collected; Dependabot tracks SHA
      # pins and proposes updates. The toolchain is pinned to 1.99.1
      # (matching rust-toolchain.toml): the action requires an
      # explicit toolchain and does not read rust-toolchain.toml,
      # so CI and local developers use the same compiler.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # Cache the cargo registry and target dir so repeat runs do not
      # re-download and rebuild every dependency. Pinned to the v2
      # tag's commit; Dependabot tracks SHA pins and proposes updates.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Pinned versions (with --locked) so the tools are reproducible:
      # an unpinned `cargo install` floats to whatever is latest.
      # One step per tool so a failure names the tool that failed,
      # instead of one coupled install hiding which one broke.
      - name: Install cargo-audit
        run: cargo install cargo-audit@0.23.0 --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny@0.21.0 --locked
      - name: Install cargo-outdated
        run: cargo install cargo-outdated@0.19.0 --locked
      - name: Install cargo-machete
        run: cargo install cargo-machete@0.10.1 --locked
      - name: Lockfile is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: No unused dependencies
        run: cargo machete
      - name: No outdated dependencies
        run: cargo outdated --exit-code 1
      - name: No known advisories
        run: cargo audit
      - name: Licenses, advisories, sources
        run: cargo deny check
