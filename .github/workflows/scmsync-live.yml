# Scmsync live test: the Gitea <-> OBS scmsync bridge, weekly.
#
# This is the concept check for the scmsync bridge: the harness in
# `tests/live/scmsync-harness.py` creates a throwaway Gitea repo and
# a scmsync home test project/package, pushes git changes, and asserts
# the OBS side follows (or, for the `_link` case, refuses to). It runs
# against LOCAL instances only — the loopback OBS instance from
# `tests/live/provision.sh` and the disposable Gitea container from
# `tests/gitea/provision.sh` — never against a production instance,
# so it needs no production credentials or secrets.
#
# Schedule-only plus on-demand: it never runs on a pull request or a
# push, and its job is not a required status check — the harness
# proves the bridge concept weekly, it does not gate merges.
#
# It is slow on purpose: the OBS frontend image build takes several
# minutes, and the harness's `_link` case holds a five-minute window
# by design. The timeout is 60 minutes, matching the live job.
#
# The OBS backend fetches the repo from Gitea over the shared compose
# network: the Gitea container is attached to it (GITEA_NETWORK), so
# the scmsync clone URL names the container
# (`http://geectl-gitea-live:3000`), while geectl and git on the host
# use the loopback URL. See the harness header for the full env table.

name: scmsync-live

on:
  schedule:
    # Weekly, Mondays 06:00 UTC — the same slot as the live workflow.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: two runs would share the loopback ports and the
# compose project, so a dispatched run waits for the weekly one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scmsync-live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pin the compose command: the fixture prefers `podman compose`
      # when present, and the runner image ships Podman but no
      # standalone compose-provider binary — pin here rather than
      # depending on the runner image's toolset.
      COMPOSE: "docker compose"
    steps:
      # Pinned to the v4 tag's commit so the action cannot move under us;
      # Dependabot tracks SHA pins and proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the v1 tag's commit so the action cannot move under us
      # and the SHA cannot be garbage-collected; Dependabot tracks SHA
      # pins and proposes updates. The toolchain is pinned to 1.99.1
      # (matching rust-toolchain.toml): the action requires an
      # explicit toolchain and does not read rust-toolchain.toml,
      # so CI and local developers use the same compiler.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # Plain cache (no OS-release scoping): geectl is pure Rust with no
      # bindgen or system libraries, so the cache is not tied to a distro
      # release the way rpmcrab's is. Pinned to the v2 tag's commit;
      # Dependabot tracks SHA pins and proposes updates.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
      # Buildx with a docker-container builder, so the frontend image
      # build can export its layers to the GitHub Actions cache (the
      # gha cache exporter needs a builder that supports it, and this
      # also guarantees a current Buildx/BuildKit — the v2 cache API
      # needs Buildx >= 0.21 / BuildKit >= 0.20). Pinned to the v4
      # tag's commit; Dependabot tracks SHA pins and proposes updates.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Expose the GitHub Actions runtime (ACTIONS_CACHE_URL /
      # ACTIONS_RUNTIME_TOKEN) to the following steps: BuildKit's
      # `type=gha` cache backend reads them from the environment, and
      # a plain `run:` step does not provide them — without this step
      # the frontend build silently skips both the cache import and
      # the cache export (no error, no cache). Pinned to the v4
      # tag's commit; Dependabot tracks SHA pins and proposes updates.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - name: Provision live OBS instance
        env:
          # Enables the BuildKit GitHub Actions cache for the frontend
          # image build (see tests/live/docker-compose.cache.yml).
          LIVE_CACHE: "1"
          # Its own compose project, so the Gitea container can join
          # this stack's network by name below.
          COMPOSE_PROJECT_NAME: geectl-scmsync
        run: bash tests/live/provision.sh
      - name: Provision disposable Gitea instance
        env:
          # Attach the Gitea container to the OBS stack's network, so
          # the OBS backend reaches it by container name
          # (SCMSYNC_GITEA_URL in the harness step). The loopback
          # publish is untouched: geectl and git still use 127.0.0.1.
          GITEA_NETWORK: geectl-scmsync_default
        run: bash tests/gitea/provision.sh
      - name: Build geectl
        run: cargo build --locked
      - name: Run scmsync harness against the local instances
        env:
          GEECTL_BIN: ${{ github.workspace }}/target/debug/geectl
          GEECTL_OBS_URL: http://127.0.0.1:3000
          # The local instance's bootstrap admin (the OBS development
          # defaults, ephemeral, never a real credential).
          GEECTL_OBS_USERNAME: Admin
          GEECTL_OBS_PASSWORD: opensuse
          # GEECTL_GITEA_URL comes from the Gitea provision step
          # (exported to $GITHUB_ENV). GEECTL_GITEA_TOKEN_FILE is the
          # token file that step writes (tests/gitea/.gitea-token);
          # the harness fails fast without it.
          GEECTL_GITEA_TOKEN_FILE: ${{ github.workspace }}/tests/gitea/.gitea-token
          GITEA_USER: geectl
          # The URL the OBS backend uses to fetch the repo: the Gitea
          # container's name on the shared compose network.
          SCMSYNC_GITEA_URL: http://geectl-gitea-live:3000
        run: python3 tests/live/scmsync-harness.py
      - name: Tear down disposable Gitea instance
        if: always()
        run: bash tests/gitea/teardown.sh
      - name: Tear down live OBS instance
        if: always()
        env:
          COMPOSE_PROJECT_NAME: geectl-scmsync
        run: bash tests/live/teardown.sh
