# Temporal live tests: scheduled live tests against a temporal OBS instance.
#
# This is layer 2 of the testing design (see docs/architecture.md). It
# spins up a real (temporary) OBS instance from the OBS project's own
# development containers, runs the live tests in `tests/temporal.rs` and
# `tests/temporal_obs.rs` against it, and tears it down. The assertions are on server state —
# what geectl reads must reflect what the server actually holds — which
# is what catches drift as OBS changes underneath us. Fixtures alone
# cannot do that.
#
# This job is INDEPENDENT and does NOT gate PRs: it is not a required
# status check. When it regresses, it is fixed independently. It runs
# on every pull request, weekly (Mondays 06:00 UTC, the same slot as
# the freshness workflow), and on demand.
#
# It is slow on purpose: the OBS source checkout plus the frontend
# image build take several minutes, and the bootstrap plus readiness
# wait add more. The timeout is 60 minutes. The frontend image build
# reuses BuildKit's GitHub Actions cache (see
# `tests/temporal/docker-compose.cache.yml`), so repeat runs skip the
# gem install when the OBS source has not changed. If it proves too
# slow or flaky on GitHub-hosted runners, the alternative is a
# dedicated host — that is a decision for the maintainer, not
# something to guess here.

name: temporal

on:
  pull_request:
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run of the same workflow on the same ref, but only
# for pull requests: a push to main must never cancel a running main
# build. Matches test.yml (and rpmcrab's ci.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  temporal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pinned to the v4 tag's commit so the action cannot move under us;
      # Dependabot tracks SHA pins and proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the v1 tag's commit so the action cannot move under us
      # and the SHA cannot be garbage-collected; Dependabot tracks SHA
      # pins and proposes updates. The toolchain is pinned to 1.99.1
      # (matching rust-toolchain.toml): the action requires an
      # explicit toolchain and does not read rust-toolchain.toml,
      # so CI and local developers use the same compiler.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # Plain cache (no OS-release scoping): geectl is pure Rust with no
      # bindgen or system libraries, so the cache is not tied to a distro
      # release the way rpmcrab's is. Pinned to the v2 tag's commit;
      # Dependabot tracks SHA pins and proposes updates.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
      # Buildx with a docker-container builder, so the frontend image
      # build can export its layers to the GitHub Actions cache (the
      # gha cache exporter needs a builder that supports it, and this
      # also guarantees a current Buildx/BuildKit — the v2 cache API
      # needs Buildx >= 0.21 / BuildKit >= 0.20). Pinned to the v3
      # tag's commit; Dependabot tracks SHA pins and proposes updates.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Expose the GitHub Actions runtime (ACTIONS_CACHE_URL /
      # ACTIONS_RUNTIME_TOKEN) to the following steps: BuildKit's
      # `type=gha` cache backend reads them from the environment, and
      # a plain `run:` step does not provide them — without this step
      # the frontend build silently skips both the cache import and
      # the cache export (no error, no cache). Pinned to the v4 tag's
      # commit; Dependabot tracks SHA pins and proposes updates.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
      - name: Provision temporal OBS instance
        env:
          # Enables the BuildKit GitHub Actions cache for the frontend
          # image build (see tests/temporal/docker-compose.cache.yml).
          # Local runs leave it unset and build uncached, as before.
          TEMPORAL_CACHE: "1"
        run: bash tests/temporal/provision.sh
      - name: Run live tests against the temporal instance
        env:
          GEECTL_TEMPORAL_URL: http://127.0.0.1:3000
          # The harness panics (instead of skipping) when this marker
          # is set and the URL is missing: in this job the URL must be
          # wired, so a silent skip would hide drift. Other jobs (and
          # local runs) leave it unset and skip.
          GEECTL_TEMPORAL_REQUIRED: "true"
        run: cargo test --locked --test temporal
      - name: Run OBS live tests against the temporal instance
        env:
          GEECTL_TEMPORAL_URL: http://127.0.0.1:3000
          # Same marker as above: in this job the URL must be wired,
          # so a silent skip would hide drift.
          GEECTL_TEMPORAL_REQUIRED: "true"
        run: cargo test --locked --test temporal_obs
      - name: Tear down temporal OBS instance
        if: always()
        run: bash tests/temporal/teardown.sh
