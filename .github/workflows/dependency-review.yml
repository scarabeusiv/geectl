---
name: dependency-review
on:
  pull_request:

permissions:
  contents: read

# Cancel a superseded run on the same ref: this workflow is PR-only,
# so a rapid push supersedes the previous run. Matches test.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # comment-summary-in-pr posts the review summary as a PR comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # The project is Apache-2.0; deny licences that cannot be
          # linked into it. The allow-list in deny.toml is the
          # compile-time floor; this guards the PR-time graph.
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-1.0-only, AGPL-3.0-only, AGPL-3.0-or-later, LGPL-2.0-only, LGPL-2.1-only, LGPL-3.0-only, LGPL-2.0-or-later, LGPL-2.1-or-later, LGPL-3.0-or-later, SSPL-1.0, CC-BY-NC-4.0, CC-BY-NC-SA-4.0
          # Swatinem/rust-cache is a CI-only action (not code linked into
          # the binary); its LGPL-3.0 license does not affect the
          # Apache-2.0 project, so it is allowlisted here. The deny list
          # above is unchanged.
          # r-efi 6.0.0 arrives via getrandom 0.4.3 and is licensed
          # `MIT OR Apache-2.0 OR LGPL-2.1-or-later`: usable under MIT
          # or Apache-2.0, both allowed, but the action flags it because
          # one disjunct (LGPL-2.1-or-later) is in the deny list above.
          # `cargo deny` is green on the same head, so this allowlist
          # entry is the only change needed.
          allow-dependencies-licenses: 'pkg:githubactions/swatinem/rust-cache, pkg:cargo/r-efi'
