name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded run of the same workflow on the same ref, but only
# for pull requests: a push to main must never cancel a running main
# build. Matches rpmcrab's ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to the v4 tag's commit so the action cannot move under us;
      # Dependabot tracks SHA pins and proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the v1 tag's commit so the action cannot move under us
      # and the SHA cannot be garbage-collected; Dependabot tracks SHA
      # pins and proposes updates. The toolchain is derived from
      # Cargo.toml `rust-version` (the single source of truth) by the
      # shared read-rust-version step, which also exports RUSTUP_TOOLCHAIN
      # so the derived toolchain outranks rust-toolchain.toml; the
      # assert below proves the derived toolchain is the one in use.
      - uses: ./.github/actions/read-rust-version
        id: toolchain
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.value }}
          components: rustfmt, clippy
      - name: Assert derived toolchain
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.value }}
        run: |
          rustc --version
          rustc --version | grep -Fq "$TOOLCHAIN"
      # Pinned to the v2 tag's commit; Dependabot tracks SHA pins and
      # proposes updates. Plain cache (no OS-release scoping): geectl
      # is pure Rust with no bindgen or system libraries, so the cache
      # is not tied to a distro release the way rpmcrab's is.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
      # Live Gitea tests (tests/gitea.rs) run in this job, against a
      # disposable Gitea container provisioned here. They are fast
      # (~20s end to end: a single prebuilt image), so they gate like
      # the rest of the suite — unlike the OBS live job, which is
      # scheduled because it takes minutes. The provision script exports
      # GEECTL_GITEA_URL and GEECTL_GITEA_TOKEN for the test step (the
      # token is masked, never printed). The instance is loopback-only
      # and destroyed after the run.
      - name: Provision disposable Gitea instance
        run: bash tests/gitea/provision.sh
      # Fixtures are a separate step from provisioning: the live
      # tests assume pool/systemd exists and fail clearly when it
      # does not, so a missing populate step cannot silently pass.
      - name: Populate Gitea fixtures
        run: bash tests/gitea/populate-fixtures.sh
      - name: Run the test suite
        env:
          # The live Gitea tests expect a provisioned instance in this
          # job: the harness fails loudly when the URL is missing here,
          # so a broken provision step cannot silently skip the live
          # suite. Other jobs (beta, macOS) do not set this and skip
          # the live tests quietly.
          GEECTL_GITEA_EXPECTED: "1"
        run: cargo test --locked
      # The generator binary is feature-gated, so the default test
      # run never builds it: its tests run here, with the feature on.
      - name: Run the generator tests
        run: cargo test --locked --features gen --bin geectl-gen
      - name: Tear down disposable Gitea instance
        if: always()
        run: bash tests/gitea/teardown.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets --features gen --locked -- -D warnings

  # Devel (beta) compiler, non-failing: an early-warning leg for upcoming
  # toolchain breaks. rust-toolchain.toml outranks the dtolnay default, so
  # the beta toolchain is selected via RUSTUP_TOOLCHAIN at job level and
  # asserted. Matches rpmcrab's rust-beta job.
  rust-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      RUSTUP_TOOLCHAIN: beta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: beta
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
          # This leg is expected to fail sometimes; with main the only
          # cache writer, a beta break would otherwise freeze the cache.
          cache-on-failure: true
      - name: Assert beta toolchain
        run: |
          rustc --version
          rustc --version | grep -q beta
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run the test suite
        run: cargo test --locked

  # Minimum supported Rust version, read from Cargo.toml `rust-version`
  # and enforced here. Matches rpmcrab's rust-msrv job (minus its RPM
  # toolchain install, which geectl does not need).
  rust-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/read-rust-version
        id: msrv
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.value }}
      # The shared step exports RUSTUP_TOOLCHAIN, so the MSRV is actually
      # used despite rust-toolchain.toml outranking the rustup default;
      # assert it here.
      - name: Assert MSRV toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.value }}
        run: |
          rustc --version
          rustc --version | grep -Fq "$MSRV"
      # cargo check, not build, over --all-targets: an MSRV break in test
      # code or a dev-dependency otherwise passes here and only bites a
      # contributor.
      - name: cargo check at MSRV
        run: cargo check --all-targets --locked

  # Platform spread: the CLI must build and pass its tests on macOS too.
  # Clippy is platform-independent and Linux clippy covers it, so macOS
  # runs only the test suite. Matches rpmcrab's rust-macos job.
  rust-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is derived from Cargo.toml `rust-version` (the
      # single source of truth) by the shared read-rust-version step,
      # which also exports RUSTUP_TOOLCHAIN so the derived toolchain
      # outranks rust-toolchain.toml; the assert below proves the
      # derived toolchain is the one in use.
      - uses: ./.github/actions/read-rust-version
        id: toolchain
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.value }}
      - name: Assert derived toolchain
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.value }}
        run: |
          rustc --version
          rustc --version | grep -Fq "$TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
      - name: Run the test suite
        run: cargo test --locked

  # Platform spread: the CLI must build and pass its tests on Windows too.
  # Clippy is platform-independent and Linux clippy covers it, so Windows
  # runs only the test suite. Mirrors rust-macos.
  rust-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is derived from Cargo.toml `rust-version` (the
      # single source of truth) by the shared read-rust-version step,
      # which also exports RUSTUP_TOOLCHAIN so the derived toolchain
      # outranks rust-toolchain.toml; the assert below proves the
      # derived toolchain is the one in use.
      - uses: ./.github/actions/read-rust-version
        id: toolchain
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # Derived from Cargo.toml rust-version, not floating stable.
          toolchain: ${{ steps.toolchain.outputs.value }}
      - name: Assert derived toolchain
        env:
          TOOLCHAIN: ${{ steps.toolchain.outputs.value }}
        # The Windows runner defaults to PowerShell; the assert is bash.
        shell: bash
        run: |
          rustc --version
          rustc --version | grep -Fq "$TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          workspaces: . -> target
      - name: Run the test suite
        run: cargo test --locked

  # Dependency policy as a CI gate (not only the weekly freshness
  # workflow): licenses, advisories, sources. Matches rpmcrab's
  # rust-deny job. cargo-deny 0.21.0 because deny.toml is the 0.21
  # schema (rpmcrab uses 0.20.2).
  rust-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The EmbarkStudios/cargo-deny-action Docker image pulls
      # rust:1.85.0-alpine3.20 from Docker Hub at build time, which fails
      # on GitHub-hosted runners with 429 rate limits. Install the
      # upstream prebuilt cargo-deny binary directly instead.
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: 0.21.0
          # Pinned sha256 of cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz
          # (upstream release artifact); the checksum no longer comes over the wire.
          CARGO_DENY_SHA256: a2170b854ff697e79e39c4c538981c9c1bdd803addbae6719a4cb66b4585a903
        run: |
          set -euo pipefail
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSLf --retry 3 -o /tmp/cargo-deny.tar.gz "$url"
          echo "${CARGO_DENY_SHA256}  /tmp/cargo-deny.tar.gz" | sha256sum -c -
          mkdir -p /tmp/cargo-deny
          tar -xzf /tmp/cargo-deny.tar.gz -C /tmp/cargo-deny
          sudo install -m 755 "/tmp/cargo-deny/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin/cargo-deny
          cargo-deny --version
      - name: cargo deny check
        run: cargo-deny --manifest-path Cargo.toml check
