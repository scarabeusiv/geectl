# Debug re-run: when a CI or live run fails, re-run its failed jobs once
# with debug logging on, so nobody has to commit temporary debug changes
# to diagnose a red run.
#
# How it works: GitHub fires this workflow when a watched run completes.
# It re-runs only the failed jobs of that run, once, with debug logging
# enabled for the re-run attempt only. Debug logging stays off by default.
#
# Guards:
# - Only on a failure or timeout conclusion: a hung run concludes
#   `timed_out`, and that is exactly the failure mode debug logs help
#   diagnose. `cancelled` and `neutral` stay excluded.
# - Only the first attempt of a run (run_attempt == 1): a failing debug
#   re-run is attempt 2, so it can never trigger another re-run.
# - Only the workflows listed below: test and live. release is
#   deliberately excluded (a failed release re-run could re-publish),
#   as are CodeQL, actionlint, dependency-review, typos and freshness,
#   whose re-runs have side effects or gain nothing from debug logs.
# - This workflow never watches itself: it is not in the list, and the
#   job also refuses any event whose workflow is this one.
#
# Note: a workflow_run-triggered workflow only fires once its file is on
# the default branch, so this becomes active when this change merges.
# Debug logs are verbose; secrets stay masked in them (GitHub masks
# registered secrets), and the watched runs use no real credentials:
# the live suite talks to disposable local OBS and Gitea containers.
#
# https://docs.github.com/en/rest/actions/workflow-runs#re-run-failed-jobs-from-a-workflow-run

name: debug-rerun

on:
  workflow_run:
    workflows: ["test", "live"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-failed:
    if: >-
      ${{ (github.event.workflow_run.conclusion == 'failure'
      || github.event.workflow_run.conclusion == 'timed_out')
      && github.event.workflow_run.run_attempt == 1
      && github.event.workflow_run.name != 'debug-rerun' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run failed jobs with debug logging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error --max-time 60 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs" \
            -d '{"enable_debug_logging":true}'
