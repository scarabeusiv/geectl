# End-to-end local build: a real podman build of a small fixture package
# against a local OBS instance.
#
# This is the live proof for the local-build vertical (see
# docs/local-build-design.md): the per-PR suite proves the logic with a
# stub podman, this job proves the real engine, image, and cache end to
# end. It gates PRs: each leg is a required status check. When a leg
# regresses, it blocks the merge until fixed. It runs
# on every pull request, weekly (Mondays 06:00 UTC, the same slot as
# the freshness workflow and the live job), and on demand.
#
# The job is a matrix of container shapes (rootless, the default, and
# privileged, the `--privileged` opt-in) by platform (Ubuntu, macOS,
# Windows). Each leg provisions the same local OBS instance and builds
# the same fixture package, so a shape or platform regression shows
# per leg. macOS tests rootless only: geectl refuses `--privileged`
# on macOS, so there is no privileged leg there. The privileged shape
# bind-mounts the host build root, and on macOS that root sits on the
# podman machine's virtiofs share, where rpm's 0200 placeholder files
# fail to install. That is host/container behaviour, not the
# privilege itself.
#
# macOS runs on `macos-15-intel`, not `macos-latest`: the OBS
# instance's images are amd64-only, and the arm64 runner cannot run
# them (Ruby segfaults under qemu emulation). The Intel runner runs
# them natively. Revisit when the OBS images are multi-arch.
#
# The build runs against a local OBS instance, not api.opensuse.org:
# the job provisions the same temporary instance the live job uses
# (`tests/live/provision.sh`), enables download-on-demand in the
# backend config and starts the download-on-demand daemon the
# development backend leaves out, creates the fixture project
# (`tests/local_build_e2e/provision-fixture.sh` — a
# download-on-demand repository backed by the Tumbleweed OSS
# repository, so the scheduler can resolve the base-system dep set),
# and runs the `local_build_e2e` integration test against it. The
# instance's bootstrap admin credentials authenticate the test — no
# real OBS credential is used anywhere.
#
# The job installs podman (the host needs nothing else: the engine
# runs inside the container) and runs the
# `local_build_e2e` integration test, which skips unless
# `GEECTL_LOCAL_BUILD_E2E` is `1`.

name: local-build-e2e

on:
  pull_request:
  schedule:
    # Weekly, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded run of the same workflow on the same ref, but only
# for pull requests: a push to main must never cancel a running main
# build. Matches test.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  local-build-e2e:
    strategy:
      # One leg failing must not cancel the others: every leg
      # reports, so a shape or platform regression is visible
      # per leg instead of hidden behind a cancelled run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-2025]
        shape: [rootless, privileged]
        exclude:
          # macOS tests rootless only: geectl refuses `--privileged`
          # on macOS, so the privileged leg does not exist there.
          - os: macos-15-intel
            shape: privileged
        include:
          # The compose command per platform: Ubuntu and Windows
          # run the OBS instance on the preinstalled Docker;
          # macOS has no Docker, so the instance runs on podman
          # compose (with the docker-compose provider installed
          # below).
          - os: ubuntu-latest
            compose: "docker compose"
          - os: macos-15-intel
            compose: "podman compose"
          - os: windows-2025
            compose: "docker compose"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      # Windows defaults to PowerShell; the provision scripts and
      # the steps below are bash, so every `run:` step uses bash
      # on all three platforms (Git Bash on Windows).
      run:
        shell: bash
    env:
      COMPOSE: ${{ matrix.compose }}
      GEECTL_LOCAL_BUILD_E2E_SHAPE: ${{ matrix.shape }}
    steps:
      # Pinned to the v7 tag's commit so the action cannot move under us;
      # Dependabot tracks SHA pins and proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the v1 tag's commit so the action cannot move under us
      # and the SHA cannot be garbage-collected; Dependabot tracks SHA
      # pins and proposes updates. The toolchain is pinned to 1.99.1
      # (matching rust-toolchain.toml): the action requires an
      # explicit toolchain and does not read rust-toolchain.toml,
      # so CI and local developers use the same compiler.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      # Pinned to the v2 tag's commit; Dependabot tracks SHA pins and
      # proposes updates. Plain cache (no OS-release scoping): geectl
      # is pure Rust with no bindgen or system libraries, so the cache
      # is not tied to a distro release the way rpmcrab's is.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
      # Buildx with a docker-container builder, so the frontend image
      # build can export its layers to the GitHub Actions cache (the
      # gha cache exporter needs a builder that supports it, and this
      # also guarantees a current Buildx/BuildKit — the v2 cache API
      # needs Buildx >= 0.21 / BuildKit >= 0.20). Pinned to the v4
      # tag's commit; Dependabot tracks SHA pins and proposes updates.
      # Ubuntu only: the BuildKit cache is used only when the
      # frontend is built with docker buildx there; macOS builds
      # it with podman compose and Windows with docker compose,
      # both uncached.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: matrix.os == 'ubuntu-latest'
      # Expose the GitHub Actions runtime (ACTIONS_CACHE_URL /
      # ACTIONS_RUNTIME_TOKEN) to the following steps: BuildKit's
      # `type=gha` cache backend reads them from the environment, and
      # a plain `run:` step does not provide them — without this step
      # the frontend build silently skips both the cache import and
      # the cache export (no error, no cache). Pinned to the v4 tag's
      # commit; Dependabot tracks SHA pins and proposes updates.
      # Ubuntu only, with the Buildx step above.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4
        if: matrix.os == 'ubuntu-latest'
      # Podman, per platform: the engine runs inside the build
      # container, so the host needs podman and a running machine
      # where the host cannot run containers natively.
      - name: Install podman (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version
      - name: Install podman (macOS)
        if: matrix.os == 'macos-15-intel'
        run: |
          set -euo pipefail
          # Homebrew ships no podman bottle for Intel macOS 15, so
          # install the pinned upstream package instead (the same
          # 5.8.10 winget installs on Windows). The package puts
          # the binary in /opt/podman/bin, which is not on PATH in
          # this step.
          # docker-compose is the compose provider `podman compose`
          # needs to parse the file (see COMPOSE above).
          brew install docker-compose
          curl -fsSL -o /tmp/podman.pkg https://github.com/containers/podman/releases/download/v5.8.10/podman-installer-macos-amd64.pkg
          sudo installer -pkg /tmp/podman.pkg -target /
          echo "/opt/podman/bin" >> "$GITHUB_PATH"
          export PATH="/opt/podman/bin:$PATH"
          podman --version
          docker-compose --version
      - name: Install podman (Windows)
        if: matrix.os == 'windows-2025'
        run: |
          set -euo pipefail
          winget install --id RedHat.Podman --exact --silent --accept-source-agreements --accept-package-agreements
          # $GITHUB_PATH takes effect only in later steps, so add
          # the install directory to this step's PATH too.
          echo "C:/Program Files/RedHat/Podman" >> "$GITHUB_PATH"
          export PATH="$PATH:/c/Program Files/RedHat/Podman"
          podman --version
      # The OBS source checkout (see the next step) must sit on a
      # case-sensitive filesystem: the obs-build submodule holds
      # both a `build` file and a `Build/` directory, which cannot
      # coexist on a case-insensitive one. Ubuntu's filesystem is
      # case-sensitive already, so only macOS and Windows prepare
      # one here. The source directory is set before the podman
      # machine starts, so the machine's share includes it.
      - name: Prepare case-sensitive OBS source (macOS)
        if: matrix.os == 'macos-15-intel'
        run: |
          set -euo pipefail
          # A case-sensitive APFS disk image, mounted under $HOME so
          # the podman machine's virtiofs share (the home directory)
          # carries it into the VM. The runner is discarded after
          # the job, so no detach step is needed.
          hdiutil create -size 4g -fs "Case-sensitive APFS" -volname obssrc "$HOME/obssrc.dmg"
          hdiutil attach "$HOME/obssrc.dmg" -mountpoint "$HOME/obssrc"
          echo "OBS_SOURCE_DIR=$HOME/obssrc/obs" >> "$GITHUB_ENV"
      - name: Prepare case-sensitive OBS source (Windows)
        if: matrix.os == 'windows-2025'
        run: |
          set -euo pipefail
          # Case sensitivity is inherited by subdirectories, so
          # enabling it on the parent makes the clone provision.sh
          # creates inside it case-sensitive too.
          obs_case="$(cygpath -m "$GITHUB_WORKSPACE")/obs-case"
          mkdir -p "$obs_case"
          fsutil file setCaseSensitiveInfo "$(cygpath -w "$obs_case")" enable
          echo "OBS_SOURCE_DIR=$obs_case/obs" >> "$GITHUB_ENV"
      # The podman machine (macOS and Windows only; Ubuntu runs
      # podman natively on the host). Two CPUs and 4 GiB: the
      # engine installs a full base system inside the machine.
      - name: Start podman machine
        if: matrix.os != 'ubuntu-latest'
        run: |
          set -euo pipefail
          podman machine init --cpus 2 --memory 4096
          if [ "$RUNNER_OS" = Windows ]; then
            # Windows runs a Windows-containers Docker daemon that
            # races podman for the default Docker API pipe, so point
            # the Docker client at the podman machine explicitly.
            # The machine runs rootful so the BuildKit container the
            # frontend build creates can set up its cgroup.
            podman machine set --rootful
            echo "DOCKER_HOST=npipe:////./pipe/podman-machine-default" >> "$GITHUB_ENV"
          fi
          podman machine start
          podman info
      # The fixture repository's arch, derived once so the cache key,
      # the link into the backend in tests/live/provision.sh and
      # the fixture script all agree on it.
      - name: Set fixture arch
        run: echo "FIXTURE_ARCH=$(uname -m)" >> "$GITHUB_ENV"
      # The cache key tracks the live Tumbleweed snapshot: the repomd
      # checksum changes exactly when the upstream snapshot rotates,
      # so a rotation saves the refreshed payload under a new key
      # instead of freezing the cache at the first snapshot. The
      # download URL is read from the fixture script, so the two
      # cannot drift apart. The fetch must not fail the job, and a
      # failed fetch must not restore a stale payload: when the
      # repomd is unreachable the restore step is skipped and the
      # run fetches fresh, and nothing is saved under the failed
      # key.
      - name: Compute download-on-demand cache key
        id: dod-cache-key
        run: |
          set -euo pipefail
          dod_url="$(sed -n 's/.*<download [^>]*url="\([^"]*\)".*/\1/p' tests/local_build_e2e/provision-fixture.sh | head -1)"
          repomd_url="${dod_url:-https://download.opensuse.org/tumbleweed/repo/oss/}repodata/repomd.xml"
          # macOS ships no sha256sum; shasum is the same hash.
          hash_cmd="sha256sum"
          command -v sha256sum >/dev/null 2>&1 || hash_cmd="shasum -a 256"
          if repomd_sha="$(curl -fsSL --max-time 60 "$repomd_url" | $hash_cmd | cut -d' ' -f1)"; then
            echo "repomd-ok=true" >> "$GITHUB_OUTPUT"
            echo "key-suffix=$repomd_sha" >> "$GITHUB_OUTPUT"
          else
            echo "repomd fetch failed; skipping the download-on-demand cache restore" >&2
            echo "repomd-ok=false" >> "$GITHUB_OUTPUT"
          fi
      # Restore the download-on-demand payload cache: the fixture
      # repository's fetched RPMs and parsed metadata, served to the
      # backend by tests/live/docker-compose.dod-cache.yml (bind-mounted
      # at /srv/obs/dod-cache and linked into place by provision.sh).
      # An exact-key miss falls back to the newest same-arch entry
      # below, rechecked in-run by the daemon (the fixture's
      # recheck wait; a failed recheck leaves the last-known-good
      # payload, as the fixture notes). Pinned to the v4 tag's commit
      # so the action cannot move under us; Dependabot tracks SHA pins
      # and proposes updates.
      - name: Restore download-on-demand cache
        if: steps.dod-cache-key.outputs.repomd-ok == 'true'
        id: dod-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/live/dod-cache
          key: dod-full-${{ env.FIXTURE_ARCH }}-${{ steps.dod-cache-key.outputs.key-suffix }}-${{ hashFiles('tests/local_build_e2e/provision-fixture.sh', 'tests/live/docker-compose.dod-cache.yml', 'tests/live/provision.sh') }}
          restore-keys: |
            dod-full-${{ env.FIXTURE_ARCH }}-
      - name: Provision live OBS instance
        env:
          # Enables the BuildKit GitHub Actions cache for the frontend
          # image build (see tests/live/docker-compose.cache.yml).
          # Ubuntu only: macOS builds the frontend with podman
          # compose and Windows with docker compose, both uncached.
          # Local runs leave it unset and build uncached, as before.
          LIVE_CACHE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
          # Enables download-on-demand in the development backend
          # (see tests/live/provision.sh): without it the scheduler
          # never writes a doddata entry and the fixture repository
          # never resolves.
          LIVE_ENABLE_DOD: "1"
          # Enables the download-on-demand payload cache (see
          # tests/live/docker-compose.dod-cache.yml): the backend's
          # fixture :full directory is served from this directory
          # (bind-mounted at /srv/obs/dod-cache and linked into place
          # by provision.sh), restored by the step above. Local runs
          # leave it unset and fetch fresh, as before.
          DOD_CACHE: "1"
          DOD_CACHE_DIR: ${{ github.workspace }}/tests/live/dod-cache
        run: bash tests/live/provision.sh
      # The development backend does not start the download-on-demand
      # daemon, and the fixture project's repository is
      # download-on-demand: without it the scheduler never fetches the
      # repository metadata or the base RPMs, and the buildinfo never
      # resolves. `exec -d` detaches the exec session; the daemon
      # itself runs in the foreground.
      - name: Start the download-on-demand daemon
        run: $COMPOSE -f tests/live/docker-compose.yml exec -d backend /obs/src/backend/bs_dodup --logfile /srv/obs/log/bs_dodup.log
      # Fail fast when the daemon did not start: `exec -d` returns 0
      # once the process is spawned, so a daemon that dies at once
      # (bad flag, unwritable log, already running) would otherwise
      # surface only as a buildinfo timeout minutes later. The lock
      # file exists only once the daemon passed option parsing, the
      # log open, and lock acquisition — but it also survives a dead
      # daemon, so the process itself is checked too.
      - name: Check the download-on-demand daemon is running
        run: |
          for attempt in 1 2 3 4 5 6; do
            if $COMPOSE -f tests/live/docker-compose.yml exec -T backend sh -c 'test -f /srv/obs/run/bs_dodup.lock && ps aux | grep -q "[b]s_dodup"'; then
              echo "bs_dodup is running (lock file present, process alive)."
              exit 0
            fi
            echo "waiting for bs_dodup (attempt $attempt/6)..."
            sleep 5
          done
          echo "bs_dodup did not start: no lock file and live process after 30s" >&2
          $COMPOSE -f tests/live/docker-compose.yml logs backend | tail -30 >&2
          exit 1
      - name: Provision local-build fixture project
        env:
          GEECTL_LIVE_URL: http://127.0.0.1:3000
        run: bash tests/local_build_e2e/provision-fixture.sh
      - name: Run the local-build end-to-end test
        env:
          # The test skips without this marker: a missing marker here
          # would silently pass the job with no build run, so the
          # marker is the job's own proof it ran.
          GEECTL_LOCAL_BUILD_E2E: "1"
          # The test builds against the provisioned local instance:
          # a missing URL with the marker set fails the test instead
          # of silently skipping, so a broken fixture is visible.
          GEECTL_LIVE_URL: http://127.0.0.1:3000
        run: cargo test --locked --test local_build_e2e
      # Report the download-on-demand cache: hit or miss, and the
      # payload the run fetched or reused. This is the measurement
      # for the cache leg: a cold run shows the fresh fetch volume,
      # a warm run shows the reuse.
      - name: Report download-on-demand cache
        if: always()
        run: |
          set -euo pipefail
          echo "cache-hit: ${{ steps.dod-cache-restore.outputs.cache-hit }}"
          if [ -d tests/live/dod-cache ]; then
            echo "payload size: $(du -sh tests/live/dod-cache | cut -f1)"
            echo "rpm count: $(find tests/live/dod-cache -name '*.rpm' | wc -l)"
            echo "entries: $(find tests/live/dod-cache -mindepth 1 -maxdepth 1 | wc -l)"
          else
            echo "no download-on-demand cache directory"
          fi
      - name: Tear down live OBS instance
        if: always()
        run: bash tests/live/teardown.sh
      # Save the download-on-demand payload cache. It runs after the
      # teardown, so the saved directory is quiescent: the daemon is
      # stopped and nothing writes into it while it is tarred. It
      # runs only when the run succeeded, so a failed run never
      # poisons the cache with a partial fetch — and only when the
      # repomd fetch succeeded and the restore was not an exact hit:
      # cache entries are immutable,
      # so saving under an already-existing key can never persist
      # anything. A rotation (new repomd suffix) or a cold run is a
      # miss, and the refreshed payload is saved under the new key.
      # Pinned to the v4 tag's commit, as above.
      - name: Save download-on-demand cache
        if: success() && steps.dod-cache-key.outputs.repomd-ok == 'true' && steps.dod-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/live/dod-cache
          key: dod-full-${{ env.FIXTURE_ARCH }}-${{ steps.dod-cache-key.outputs.key-suffix }}-${{ hashFiles('tests/local_build_e2e/provision-fixture.sh', 'tests/live/docker-compose.dod-cache.yml', 'tests/live/provision.sh') }}
